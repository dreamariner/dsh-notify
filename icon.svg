<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <!-- 插件图标：一只摇铃（回合结束即响铃）。透明背景（无底板），
       青到蓝的双色对角渐变，与 DSH 内置插件图标的风格同族。
       约束：SVG / PNG / JPEG / WebP，≤ 256 KiB，路径不得离开包内。 -->
  <defs>
    <linearGradient id="bell-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#41d1c8"/>
      <stop offset="1" stop-color="#2f7cf6"/>
    </linearGradient>
  </defs>
  <!-- 铃身 -->
  <path d="M18 6.5a2 2 0 0 1 2 2v.6a7 7 0 0 1 5.4 6.8v4.6l2 3.6H8.6l2-3.6v-4.6a7 7 0 0 1 5.4-6.8v-.6a2 2 0 0 1 2-2Z"
        fill="none" stroke="url(#bell-g)" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 铃舌 -->
  <path d="M15.6 27a2.4 2.4 0 0 0 4.8 0"
        fill="none" stroke="url(#bell-g)" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 声波 -->
  <path d="M27.6 10.4a6 6 0 0 1 1.6 3.9M8.4 10.4a6 6 0 0 0-1.6 3.9"
        fill="none" stroke="url(#bell-g)" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
</svg>
